<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico | GoldenPet</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[var(--cor-fundo)] text-[var(--cor-texto)]">
    <div id="navbar"></div>

    <main class="mx-auto max-w-6xl px-6 py-10">
        <div>
            <h1 class="text-2xl font-bold text-[#333333]">Histórico de serviços</h1>
            <p class="mt-1 text-sm text-[#666666]">Confira os atendimentos já realizados.</p>
        </div>

        <div id="services-list" class="mt-8 grid gap-6 md:grid-cols-2"></div>
    </main>

    <script src="../js/components.js"></script>
    <script src="../js/mock-data.js"></script>
    <script>
        lucide.createIcons();

        const servicesList = document.querySelector('#services-list');
        const { completedServices } = window.goldenPetMockData;

        if (completedServices.length === 0) {
            servicesList.innerHTML = `
                <div class="rounded-lg bg-white p-8 text-center text-[#666666] md:col-span-2">
                    <i data-lucide="clipboard-list" class="mx-auto mb-3 h-10 w-10 text-[#BF4100]"></i>
                    <p class="font-semibold">Nenhum serviço realizado.</p>
                    <p class="mt-1 text-sm">O histórico aparecerá após a conclusão de um atendimento.</p>
                </div>
            `;
            lucide.createIcons();
        } else {
            servicesList.innerHTML = completedServices.map((service) => `
                <article class="rounded-lg bg-white p-6 shadow-sm">
                    <div class="flex items-start justify-between gap-4">
                        <div>
                            <span class="inline-block rounded-full bg-[#FFF3E8] px-4 py-1 text-xs font-semibold text-[#BF4100]">
                                ${service.service} — ${service.specialty}
                            </span>
                            <h2 class="mt-4 text-lg font-bold text-[#333333]">${service.animal}</h2>
                        </div>
                        <i data-lucide="check-circle-2" class="h-6 w-6 shrink-0 text-[#BF4100]"></i>
                    </div>

                    <dl class="mt-4 divide-y divide-[#F0F0F0]">
                        <div class="flex justify-between gap-4 py-3 text-sm">
                            <dt class="text-[#777777]">Veterinário</dt>
                            <dd class="font-semibold text-[#333333]">${service.professional}</dd>
                        </div>
                        <div class="flex justify-between gap-4 py-3 text-sm">
                            <dt class="text-[#777777]">Data</dt>
                            <dd class="font-semibold text-[#333333]">${service.date}</dd>
                        </div>
                        <div class="flex justify-between gap-4 py-3 text-sm">
                            <dt class="text-[#777777]">Horário</dt>
                            <dd class="font-semibold text-[#333333]">${service.time}</dd>
                        </div>
                        <div class="flex justify-between gap-4 py-3 text-sm">
                            <dt class="text-[#777777]">Protocolo</dt>
                            <dd class="font-semibold text-[#333333]">${service.protocol}</dd>
                        </div>
                    </dl>

                    <p class="mt-4 text-sm text-[#666666]">${service.summary}</p>

                    <a href="historico-detalhe.html?id=${service.id}" class="mt-6 flex items-center justify-center gap-2 rounded-lg bg-[#BF4100] px-5 py-3 font-semibold text-white transition hover:bg-[#9D3500]">
                        Ver detalhes
                        <i data-lucide="arrow-right" class="h-4 w-4"></i>
                    </a>
                </article>
            `).join('');

            lucide.createIcons();
        }
    </script>
</body>
</html>
